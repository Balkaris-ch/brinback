<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brinback</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%230a0a0a%27/%3E%3Crect x=%272%27 y=%272%27 width=%275%27 height=%275%27 fill=%27%2325f716%27/%3E%3Crect x=%279%27 y=%272%27 width=%275%27 height=%275%27 fill=%27%23f4f3f0%27/%3E%3Crect x=%272%27 y=%279%27 width=%275%27 height=%275%27 fill=%27%23f4f3f0%27/%3E%3Crect x=%279%27 y=%279%27 width=%275%27 height=%275%27 fill=%27%23f4f3f0%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0a;
    --ink-2: #0f0f10;
    --ink-3: #141517;
    --ink-4: #1b1b1e;
    --line: #1f1f22;
    --line-2: #2a2a2e;
    --line-3: #3a3a3f;
    --paper: #f4f3f0;
    --mute: #a09f9a;
    --mute-2: #6f6e6a;
    --mute-3: #4a4946;
    --signal: #25f716;
    --signal-dim: rgba(37, 247, 22, .07);
    --amber: #e8aa48;
    --font: "Geist", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --mono: "Geist Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink); color: var(--paper); font: 400 14px/1.45 var(--font);
    -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none;
  }
  button, input, select { font: inherit; color: inherit; }
  ::selection { background: var(--signal); color: var(--ink); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border: 3px solid var(--ink); border-radius: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .mono { font-family: var(--mono); }
  .cap { font: 500 10.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mute-2); }

  /* ---------- frame */
  .app { display: grid; grid-template-rows: 58px 1fr; height: 100%; }
  header {
    display: flex; align-items: center; gap: 22px; padding: 0 22px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { display: grid; grid-template-columns: 7px 7px; gap: 2px; }
  .mark i { width: 7px; height: 7px; background: var(--paper); display: block; }
  .mark i:first-child { background: var(--signal); }
  .wordmark { font: 500 12px/1 var(--mono); letter-spacing: .26em; }
  .spacer { flex: 1; }
  .live { display: flex; align-items: center; gap: 8px; }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 0 rgba(37,247,22,.5); animation: pulse 2.4s infinite; }
  .pulse.off { background: var(--mute-3); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37,247,22,.45); } 70% { box-shadow: 0 0 0 7px rgba(37,247,22,0); } 100% { box-shadow: 0 0 0 0 rgba(37,247,22,0); } }

  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .switch .track { width: 28px; height: 16px; border: 1px solid var(--line-3); border-radius: 16px; position: relative; transition: .2s; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--mute-2); transition: .2s; }
  .switch.on .track { border-color: var(--signal); }
  .switch.on .track::after { left: 14px; background: var(--signal); }
  .switch .cap { color: var(--mute); }
  .switch.on .cap { color: var(--paper); }

  .body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }

  /* ---------- side */
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .sec { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 10px; }
  .sec .n { color: var(--mute-3); }
  .list { overflow: auto; }
  .groups { flex: 1 1 auto; min-height: 120px; }
  .row {
    position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 14px; align-items: center;
    padding: 13px 22px; cursor: pointer; border-top: 1px solid var(--line); transition: background .15s;
  }
  .row:last-child { border-bottom: 1px solid var(--line); }
  .row:hover { background: var(--ink-2); }
  .row.sel { background: var(--ink-3); }
  .row.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--signal); }
  .name { font-weight: 500; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font: 400 10.5px/1.6 var(--mono); letter-spacing: .08em; color: var(--mute); text-transform: uppercase; }
  .meta b { font-weight: 500; color: var(--paper); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mute-3); }
  .dot.all { background: var(--signal); }
  .dot.some { background: var(--amber); }

  .tick { width: 16px; height: 16px; border: 1px solid var(--line-3); display: grid; place-items: center; transition: .15s; }
  .tick:hover { border-color: var(--mute); }
  .tick.on { background: var(--signal); border-color: var(--signal); }
  .tick.on::after { content: ""; width: 8px; height: 4px; border-left: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: translateY(-1px) rotate(-45deg); }
  .glyph { width: 16px; height: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; }
  .glyph i { background: var(--mute-3); }
  .glyph.tiled i { background: var(--mute); }

  .deploybar { padding: 16px 22px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .deploybar .wide { flex: 1; width: auto; }
  .secr { display: flex; align-items: center; gap: 14px; }
  .selall { background: none; border: 0; padding: 0; cursor: pointer; color: var(--mute); }
  .selall:hover { color: var(--paper); }
  .detected { max-height: 38%; flex: 0 0 auto; }
  .credit { padding: 14px 22px 18px; border-top: 1px solid var(--line); color: var(--mute-3); }

  /* ---------- buttons */
  .btn {
    height: 38px; padding: 0 18px; border: 1px solid var(--line-2); background: transparent; border-radius: 2px;
    cursor: pointer; font-size: 13px; font-weight: 500; letter-spacing: .01em; transition: border-color .15s, background .15s, color .15s;
    display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--mute-2); }
  .btn.primary { background: var(--signal); border-color: var(--signal); color: var(--ink); }
  .btn.primary:hover { background: #3dff2c; }
  .btn.ghost { border-color: transparent; color: var(--mute); padding: 0 12px; }
  .btn.ghost:hover { color: var(--paper); }
  .btn.danger:hover { color: #ff6b5b; border-color: #5a2a24; }
  .btn[disabled] { pointer-events: none; background: transparent; border-color: var(--line-2); color: var(--mute-3); }
  .btn.wide { width: 100%; justify-content: center; }
  .btn .k { font: 500 10.5px/1 var(--mono); letter-spacing: .1em; opacity: .7; }

  /* ---------- main */
  main { display: grid; grid-template-rows: auto minmax(260px, 1fr) auto; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 16px; padding: 16px 26px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 2px; }
  .seg button { background: none; border: 0; padding: 7px 12px; cursor: pointer; font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute-2); }
  .seg button.on { color: var(--ink); background: var(--paper); }

  .stage { position: relative; margin: 10px 26px 0; min-height: 0; }
  .canvas { position: absolute; inset: 0; }
  .mon { position: absolute; border: 1px solid var(--line-2); background:
           radial-gradient(circle at 1px 1px, rgba(244,243,240,.045) 1px, transparent 0) 0 0 / 14px 14px, var(--ink-2); }
  .mon.dim, .mh.dim { opacity: .5; }
  /* screen header: name, then one chip per group on that screen, front to back */
  .mh { position: absolute; height: 30px; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; padding: 0 1px; }
  .mh .mn { font: 500 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute-2); flex: 0 0 auto; max-width: 60%; overflow: hidden; text-overflow: ellipsis; margin-right: 4px; }
  .mh .mn b { color: var(--paper); font-weight: 500; }
  .mh .mn:only-child { max-width: 100%; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 6px; border: 1px solid var(--line-3); background: var(--ink);
          font: 500 9.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--paper); cursor: pointer; flex: 0 1 auto; min-width: 30px; max-width: 170px; }
  .chip .cn { overflow: hidden; text-overflow: ellipsis; }
  .chip i { font-style: normal; color: var(--mute-2); letter-spacing: .06em; }
  .chip:hover { border-color: var(--mute); }
  .chip.on { background: var(--signal); border-color: var(--signal); color: var(--ink); }
  .chip.on i { color: rgba(10,10,10,.6); }
  .chip.snap { border-style: dashed; border-color: var(--mute); }
  .chip.snap.on { background: var(--paper); border-color: var(--paper); border-style: solid; color: var(--ink); }
  .chip.back:not(.on) { color: var(--mute); }
  .chip .ico { width: 10px; height: 10px; }

  .tile {
    position: absolute; padding: 8px 9px; overflow: hidden; border: 1px solid var(--line-3);
    background: var(--ink-3); transition: border-color .15s, background .15s; cursor: default;
    display: flex; flex-direction: column; gap: 4px;
  }
  .tile .t { font-size: 12px; font-weight: 500; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: break-word; hyphens: auto; }
  .tile .s { font: 500 9px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute-2); }
  .tile.ghost { border-color: var(--line); background: var(--ink-2); }
  .tile.ghost .t { color: var(--mute-3); font-weight: 400; }
  .tile.ghost .s { display: none; }
  .tile.pick { cursor: pointer; }
  .tile.pick:hover { border-color: var(--mute-2); }
  .tile.on { border-color: var(--signal); background: linear-gradient(var(--signal-dim), var(--signal-dim)), var(--ink-3); }
  .tile.on .s { color: var(--signal); }
  .tile.missing {
    border: 1px dashed var(--mute-2); cursor: pointer;
    background: repeating-linear-gradient(135deg, rgba(244,243,240,.035) 0 6px, transparent 6px 12px), var(--ink-2);
  }
  .tile.missing .t { color: var(--mute); }
  .tile.missing .s { color: var(--amber); }
  .tile.missing:hover { border-color: var(--amber); }
  .tile .n { position: absolute; right: 7px; bottom: 6px; font: 500 9px/1 var(--mono); color: var(--mute-2); }
  .tile.on .n { color: rgba(37,247,22,.7); }
  .tile.hv { z-index: 3; border-color: var(--signal); opacity: 1; }
  .tile.hv.ghost { background: var(--ink-3); }
  .tile.hv.ghost .t { color: var(--paper); }
  .layers g.hv .le { stroke: var(--signal); stroke-width: 1.5; }
  .layers g.hv { opacity: 1; }
  .layers g.snapl.hv .le { stroke: var(--paper); stroke-opacity: 1; }
  .chip.hv:not(.on) { border-color: var(--signal); }
  /* filtered out: still solid, so the windows behind do not bleed through - just quiet */
  .tile.out { border-color: var(--line); background: var(--ink-2); }
  .tile.out .t { color: var(--mute-3); font-weight: 400; }
  .tile.out .s, .tile.out .gi { opacity: .35; }
  .tile.out:hover .t { color: var(--mute); }
  .tile.out.hv .t { color: var(--paper); }
  .tile.match { border-color: var(--paper); }
  .tile.small { padding: 0; }
  .tile.narrow { padding: 6px 6px; gap: 3px; }
  .tile.narrow .t { font-size: 10.5px; line-height: 1.2; -webkit-line-clamp: 6; padding-right: 11px; }
  .tile.narrow .s { font-size: 7.5px; letter-spacing: .08em; }
  .tile.narrow .gi { right: 4px; top: 5px; }
  .tile.narrow .n { display: none; }
  .tile.off { border-style: dashed; border-color: var(--line-3); background: var(--ink-2); cursor: pointer; }
  .tile.off .t { color: var(--mute); }
  .tile.off:hover { border-color: var(--mute); }
  .row .name i { font-style: normal; font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute-2); margin-left: 6px; }
  .tile .t { padding-right: 16px; }

  /* grouped / not grouped */
  .ico { width: 12px; height: 12px; flex: none; display: inline-block; vertical-align: -2px; }
  .gi { position: absolute; right: 7px; top: 7px; line-height: 0; color: var(--mute-3); }
  .gi.g { color: var(--mute); }
  .tile.on .gi.g, .tile.hl .gi.g { color: var(--signal); }
  .tile.hl { border-color: rgba(37,247,22,.55); }
  .tile.loose .s { color: var(--mute-3); }
  .tile.ghost .gi { opacity: .45; }

  /* the group layer: one frame behind all of a group's windows on a screen */
  .layers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .layers .lf { fill: rgba(244,243,240,.07); shape-rendering: crispEdges; }
  .layers .le { fill: none; stroke: #5d5c57; stroke-width: 1; shape-rendering: crispEdges; }
  .layers .on .lf { fill: rgba(37,247,22,.11); }
  .layers .on .le { stroke: var(--signal); stroke-width: 1.5; filter: drop-shadow(0 0 5px rgba(37,247,22,.5)); }
  .layers .dim { opacity: .3; }
  /* a snap group Windows made that is not kept yet: dashed paper, not signal green */
  .layers .snapl .lf { fill: rgba(244,243,240,.05); }
  .layers .snapl .le { stroke: var(--paper); stroke-opacity: .65; stroke-dasharray: 5 4; }
  .layers .snapl.on .le { stroke-opacity: 1; filter: drop-shadow(0 0 5px rgba(244,243,240,.45)); }
  .state.s { color: var(--paper); }
  .dot.snap { background: var(--paper); }
  .tile.snapm .gi.g { color: var(--paper); }

  .state { width: 16px; display: grid; place-items: center; color: var(--mute-2); }
  .state.g { color: var(--signal); }
  .state.p { color: var(--amber); }
  .legend { display: flex; gap: 18px; margin-left: 10px; }
  .search { height: 28px; width: 200px; padding: 0 10px; background: var(--ink-2); border: 1px solid var(--line-2); border-radius: 2px; outline: none; font-size: 12px; }
  .search:focus { border-color: var(--mute-2); }
  .search::placeholder { color: var(--mute-3); }
  .bar { flex-wrap: wrap; row-gap: 8px; }
  /* the window list under the map */
  .wl { margin-top: 16px; border-top: 1px solid var(--line); }
  .wrow { display: grid; grid-template-columns: 16px 1fr 130px 200px 30px; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .wrow:hover { background: var(--ink-2); }
  .wrow .name { font-size: 13px; font-weight: 400; }
  .wrow .name i { font: 500 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute-2); font-style: normal; margin-left: 6px; }
  .wrow.on .name { color: var(--signal); }
  .wrow .st { font: 500 10px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow .st.g { color: var(--paper); } .wrow .st.s { color: var(--mute); } .wrow .st.u { color: var(--amber); }
  .x.fr { display: grid; place-items: center; }
  .cnt { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; border-bottom: 1px solid transparent; }
  .cnt:hover { color: var(--paper); }
  .cnt.on { color: var(--paper); border-bottom-color: var(--signal); }
  select.btnsel { width: auto; height: 38px; padding-right: 34px; background-position: calc(100% - 16px) 17px, calc(100% - 12px) 17px; }
  .mini { width: 28px; height: 18px; flex: none; }
  .mini rect { fill: none; stroke: var(--mute-3); }
  .mini.all rect { stroke: var(--signal); } .mini.some rect { stroke: var(--amber); }
  .lg { display: inline-flex; align-items: center; gap: 7px; color: var(--mute-2); }
  .lg.g { color: var(--mute); }
  .empty-stage { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute-2); }

  /* ---------- detail */
  /* fixed height: if it followed its content, the map above would resize and jump under the cursor */
  .detail { border-top: 1px solid var(--line); margin-top: 12px; padding: 18px 26px 22px; height: 34vh; overflow: auto; }
  .dhead { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .dtitle { font-weight: 300; font-size: 30px; letter-spacing: -.01em; line-height: 1.05; }
  .dtitle input { background: transparent; border: 0; border-bottom: 1px solid var(--line-3); outline: none; font-weight: 300; font-size: 30px; width: min(520px, 100%); padding: 0 0 4px; }
  .dtitle input:focus { border-color: var(--signal); }
  .dmeta { margin-top: 8px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
  .slots { margin-top: 18px; border-top: 1px solid var(--line); }
  .slot { display: grid; grid-template-columns: 30px minmax(0, 1fr) 110px 110px 160px 30px; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .slot .ix { font: 500 10.5px/1 var(--mono); color: var(--mute-3); }
  .slot .st { font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .slot .st.ok { color: var(--signal); }
  .slot .st.no { color: var(--amber); }
  .x { width: 28px; height: 28px; border: 0; background: none; color: var(--mute-3); cursor: pointer; border-radius: 2px; }
  .x:hover { color: var(--paper); background: var(--ink-3); }
  .hint { color: var(--mute); max-width: 640px; }
  .hint b { color: var(--paper); font-weight: 500; }

  select.dark {
    appearance: none; background: var(--ink-2); border: 1px solid var(--line-2); border-radius: 2px; height: 30px; padding: 0 28px 0 10px;
    font-size: 12px; width: 100%; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%);
    background-position: calc(100% - 14px) 13px, calc(100% - 10px) 13px; background-size: 4px 4px; background-repeat: no-repeat;
  }
  select.dark:hover { border-color: var(--mute-2); }

  /* ---------- popover, modal, toast */
  .pop { position: fixed; z-index: 20; width: 320px; max-height: 360px; overflow: auto; background: var(--ink-2); border: 1px solid var(--line-3); box-shadow: 0 24px 60px rgba(0,0,0,.6); }
  .pop .ph { padding: 14px 16px 10px; }
  .pop .pi { padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  .pop .pi:hover { background: var(--ink-3); }
  .pop .pi .meta { white-space: nowrap; }
  .veil { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); display: grid; place-items: center; }
  .modal { width: 420px; background: var(--ink-2); border: 1px solid var(--line-3); padding: 26px; }
  .modal p { margin: 10px 0 22px; color: var(--mute); }
  .modal .row2 { display: flex; justify-content: flex-end; gap: 10px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; z-index: 40;
    background: var(--ink-3); border: 1px solid var(--line-3); border-left: 2px solid var(--signal); padding: 12px 18px; font: 400 12px/1.5 var(--mono); letter-spacing: .02em; max-width: 720px; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-left-color: #ff6b5b; }
  .offline { position: fixed; inset: 58px 0 0 0; display: none; place-items: center; background: rgba(10,10,10,.85); z-index: 50; color: var(--mute); }
  .offline.show { display: grid; }
  .access { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 45; display: none; align-items: center; gap: 18px;
            background: var(--ink-3); border: 1px solid var(--line-3); border-left: 2px solid var(--amber); padding: 12px 14px 12px 18px; max-width: 820px; color: var(--mute); }
  .access b { color: var(--paper); font-weight: 500; }
  .access.show { display: flex; }
  /* a newer release is out: one quiet button next to the wordmark */
  .update { display: none; height: 26px; padding: 0 11px; border: 1px solid var(--signal); background: var(--signal-dim); color: var(--signal); border-radius: 2px; cursor: pointer;
            font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; align-items: center; gap: 8px; transition: background .15s, color .15s; }
  .update.show { display: inline-flex; }
  .update:hover { background: var(--signal); color: var(--ink); }
  .update.busy { pointer-events: none; border-color: var(--line-3); background: transparent; color: var(--mute); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="mark"><i></i><i></i><i></i><i></i></div><div class="wordmark">BRINBACK</div></div>
    <button class="update" id="update"></button>
    <div class="spacer"></div>
    <div class="live"><span class="pulse" id="pulse"></span><span class="cap" id="liveLabel">Live</span></div>
    <div class="switch" id="swAuto" title="When a window that belongs to a group opens, put it in its place"><span class="track"></span><span class="cap">Auto-restore</span></div>
    <div class="switch" id="swSnap" title="Windows forgets snap groups when it restarts. Keep them as groups, so they come back."><span class="track"></span><span class="cap">Keep snap groups</span></div>
    <div class="switch" id="swStart"><span class="track"></span><span class="cap" id="swStartLabel">Start with Windows</span></div>
  </header>

  <div class="body">
    <aside>
      <div class="sec"><span class="cap">Saved groups</span><span class="secr"><button class="cap selall" id="selAll" hidden>Select all</button><span class="cap n" id="gCount"></span></span></div>
      <div class="list groups" id="groups"></div>
      <div class="deploybar"><button class="btn primary wide" id="deploySel" disabled>Deploy selected</button><button class="btn danger" id="deleteSel" hidden>Delete</button></div>
      <div class="sec"><span class="cap">On screen now</span><span class="cap n" id="dCount"></span></div>
      <div class="list detected" id="detected"></div>
      <div class="credit cap">Balkaris &middot; v<span id="ver"></span></div>
    </aside>

    <main>
      <div class="bar">
        <span class="cap" id="viewLabel">Everything on screen</span>
        <button class="btn ghost" id="backAll" style="height:26px;padding:0 10px;display:none" title="Esc">&larr; Everything</button>
        <span class="legend cap"><span class="lg g" id="lgG"></span><span class="lg" id="lgU"></span></span>
        <div class="spacer"></div>
        <input class="search" id="search" placeholder="Search windows  ( / )" autocomplete="off" spellcheck="false">
        <div class="seg" id="filter" title="Which windows to show"><button data-f="all">All</button><button data-f="grouped">Grouped</button><button data-f="loose">Not grouped</button></div>
        <div class="seg" id="scope"><button data-s="claude">Claude</button><button data-s="all">All apps</button></div>
        <div class="seg" id="zoom" title="With a group or layout selected: show only its screens, larger"><button data-z="fit">Zoom</button><button data-z="all">All screens</button></div>
      </div>
      <div class="stage" id="stage"><div class="canvas" id="canvas"></div></div>
      <section class="detail" id="detail"></section>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="offline" id="offline"><div class="cap">Brinback is not running. Start it again.</div></div>
<div class="access" id="access"><span><b>Brinback needs Accessibility access</b> to read window names and move windows. macOS lets no app do that without your say-so.</span><button class="btn primary" id="grantAccess">Open System Settings</button></div>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let S = null;
let view = { kind: "live" };      // live | detected (mon) | group (id)
let scope = localStorage.getItem("wg.scope") || "claude";
let scopeTouched = !!localStorage.getItem("wg.scope");
const picked = new Set();           // handles picked in the live view
const ticked = new Set(JSON.parse(localStorage.getItem("wg.ticked") || "[]"));
let pop = null;
let hoverGroup = null;
let dpick = null;                   // windows ticked in the found layout being looked at
let hoverDet = null;                // a Windows snap group (chip) under the mouse
let filter = localStorage.getItem("wg.filter") || "all";       // all | grouped | loose
let zoomAll = localStorage.getItem("wg.zoomAll") === "1";        // selection: zoom to its screens, or show all
let query = "";
let shownUpdateError = null;

const curDetected = () => view.kind === "detected" ? detectedInScope().find(x => x.key === view.key) : null;
function openDetected(key) {
  const d = detectedInScope().find(x => x.key === key);
  view = d ? { kind: "detected", key } : { kind: "live" };
  dpick = d ? new Set(d.handles) : null;
  closePop(); render();
}
function backToAll() { view = { kind: "live" }; dpick = null; closePop(); render(); }
// "Left", or "Left 2", "Left 3" ... - the first name no group has yet.
function freeName(base) {
  const taken = x => S.groups.some(g => g.name.toLowerCase() === x.toLowerCase());
  if (!taken(base)) return base;
  for (let i = 2; ; i++) if (!taken(base + " " + i)) return base + " " + i;
}              // group row under the mouse: lit up on the map

// Grouped: two stacked frames, the front one filled. Not grouped: one dashed frame.
const ICON_GROUPED = '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 3V.5h8v8H9" fill="none" stroke="currentColor"/><rect x=".5" y="3.5" width="8" height="8" fill="currentColor" fill-opacity=".22" stroke="currentColor"/></svg>';
const ICON_FRONT = '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><rect x=".5" y="4.5" width="7" height="7" fill="none" stroke="currentColor" stroke-opacity=".5"/><rect x="4.5" y=".5" width="7" height="7" fill="currentColor" fill-opacity=".25" stroke="currentColor"/></svg>';
const ICON_LOOSE = '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-dasharray="2 1.6"/></svg>';

// Windows in a snap group that Windows made (2+ snapped windows on one screen), by handle.
function snapGroups() {
  const m = new Map();
  for (const d of (S.detectedAll || [])) if ((d.snap || []).length >= 2) for (const h of d.snap) m.set(h, d);
  return m;
}

// Which saved groups each open window belongs to.
function membership() {
  const m = new Map();
  for (const g of S.groups) for (const s of g.slots) if (s.open && s.h) {
    if (!m.has(s.h)) m.set(s.h, []);
    m.get(s.h).push(g);
  }
  return m;
}

// ------------------------------------------------------------------ server
async function getState() {
  const r = await fetch("/api/state", { headers: { "X-Token": TOKEN }, cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function act(op, body) {
  const r = await fetch("/api/action", {
    method: "POST", headers: { "Content-Type": "application/json", "X-Token": TOKEN },
    body: JSON.stringify(Object.assign({ op }, body || {}))
  });
  const j = await r.json().catch(() => ({ error: "No answer from Brinback." }));
  if (!r.ok || j.error) { const e = new Error(j.error || ("HTTP " + r.status)); e.status = r.status; throw e; }
  return j;
}
async function run(op, body, quiet) {
  try { const j = await act(op, body); if (!quiet && j.message) toast(j.message); await load(); return j; }
  catch (e) { toast(e.message, true); throw e; }
}

let busy = false;
async function load() {
  if (busy) return; busy = true;
  try {
    S = await getState();
    $("#offline").classList.remove("show");
    if (!scopeTouched && !S.claudeFound) scope = "all";
    // forget selections that no longer exist
    const live = new Set(S.windows.map(w => w.h));
    for (const h of [...picked]) if (!live.has(h)) picked.delete(h);
    for (const id of [...ticked]) if (!S.groups.some(g => g.id === id)) ticked.delete(id);
    if (view.kind === "group" && !S.groups.some(g => g.id === view.id)) view = { kind: "live" };
    render();
  } catch (e) {
    $("#offline").classList.add("show");
  } finally { busy = false; }
}
setInterval(() => { if (!document.hidden && !pop && !document.querySelector(".veil")) load(); }, 2000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

// ------------------------------------------------------------------ helpers
const winsInScope = () => S.windows.filter(w => scope === "all" || w.claude);
const detectedInScope = () => scope === "all" ? S.detectedAll : S.detected;
const monName = i => (S.monitors.find(m => m.i === i) || {}).name || "Off screen";
const winByH = h => S.windows.find(w => w.h === h);
const plural = (n, a, b) => n + " " + (n === 1 ? a : (b || a + "s"));

function toast(msg, err) {
  const t = $("#toast");
  t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), err ? 6000 : 3800);
}

function confirmBox(title, text, ok, danger) {
  return new Promise(res => {
    const v = document.createElement("div");
    v.className = "veil";
    v.innerHTML = '<div class="modal"><div class="dtitle" style="font-size:22px">' + esc(title) + '</div><p>' + esc(text) +
      '</p><div class="row2"><button class="btn ghost" data-a="0">Cancel</button><button class="btn ' + (danger ? "danger" : "primary") + '" data-a="1">' + esc(ok) + '</button></div></div>';
    v.addEventListener("click", e => {
      const a = e.target.getAttribute("data-a");
      if (a !== null || e.target === v) { v.remove(); res(a === "1"); }
    });
    document.body.appendChild(v);
    v.querySelector('[data-a="1"]').focus();
  });
}

// Only touch the DOM when something actually changed. The state refreshes every two seconds;
// rewriting the lists each time destroyed hover states and could eat a click that landed
// between mouse-down and mouse-up.
function setHTML(el, html) { if (el._html !== html) { el._html = html; el.innerHTML = html; } }

function choiceBox(title, text, buttons) {
  return new Promise(res => {
    const v = document.createElement("div");
    v.className = "veil";
    v.innerHTML = '<div class="modal"><div class="dtitle" style="font-size:22px">' + esc(title) + '</div><p>' + esc(text) + '</p><div class="row2">' +
      '<button class="btn ghost" data-a="">Cancel</button>' +
      buttons.map(b => '<button class="btn ' + (b.cls || "") + '" data-a="' + esc(b.value) + '">' + esc(b.label) + '</button>').join("") + '</div></div>';
    v.addEventListener("click", e => {
      const a = e.target.getAttribute("data-a");
      if (a !== null || e.target === v) { v.remove(); res(a || null); }
    });
    document.body.appendChild(v);
    const last = v.querySelectorAll("[data-a]"); last[last.length - 1].focus();
  });
}

function closePop() { if (pop) { pop.remove(); pop = null; } }
document.addEventListener("mousedown", e => { if (pop && !pop.contains(e.target)) closePop(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (pop) { closePop(); return; }
  if (document.querySelector(".veil") || /INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) return;
  if (view.kind !== "live") backToAll();
});

// ------------------------------------------------------------------ render
function render() {
  if (!S) return;
  $("#ver").textContent = S.version;
  const up = S.update, ub = $("#update");
  ub.classList.toggle("show", !!(up && up.version));
  if (up && up.version) {
    ub.classList.toggle("busy", !!up.working);
    ub.textContent = up.working ? "Updating to " + up.version + " ..." : "Update available · " + up.version;
    ub.title = isMac() ? "Pulls the new source and rebuilds Brinback here. macOS will ask for Accessibility again afterwards."
                       : "Downloads Brinback " + up.version + " from GitHub, checks it, and restarts. Your groups stay as they are.";
    if (up.error && up.error !== shownUpdateError) { shownUpdateError = up.error; toast("Update did not go through: " + up.error, true); }
  }
  $("#swAuto").classList.toggle("on", S.settings.autoRestore);
  $("#swStart").classList.toggle("on", S.settings.startWithWindows);
  $("#swStartLabel").textContent = isMac() ? "Open at login" : "Start with Windows";
  $("#swSnap").style.display = isMac() ? "none" : "";
  $("#access").classList.toggle("show", isMac() && S.trusted === false);
  $("#swSnap").classList.toggle("on", !!S.settings.keepSnaps);
  $("#pulse").classList.toggle("off", !S.settings.autoRestore);
  $("#liveLabel").textContent = S.settings.autoRestore ? "Watching" : "Paused";
  document.querySelectorAll("#scope button").forEach(b => b.classList.toggle("on", b.dataset.s === scope));
  document.querySelectorAll("#filter button").forEach(b => b.classList.toggle("on", b.dataset.f === filter));
  document.querySelectorAll("#zoom button").forEach(b => b.classList.toggle("on", (b.dataset.z === "all") === zoomAll));
  $("#zoom").style.display = view.kind === "live" ? "none" : "";
  const fm = focusMons();
  $("#zoom").querySelector('[data-z="all"]').textContent = "All screens" + (fm && !zoomAll && S.monitors.length > fm.size ? " (" + (S.monitors.length - fm.size) + " more)" : "");
  $("#backAll").style.display = view.kind === "live" ? "none" : "";
  if (view.kind === "detected" && !curDetected()) { view = { kind: "live" }; dpick = null; }
  renderGroups();
  renderDetected();
  renderStage();
  const editing = document.activeElement && document.activeElement.closest && document.activeElement.closest("#detail") &&
                  /INPUT|SELECT/.test(document.activeElement.tagName);
  if (!editing) renderDetail();
}

function renderGroups() {
  const el = $("#groups");
  $("#gCount").textContent = S.groups.length || "";
  if (S.storeProblem) {
    setHTML(el, '<div style="padding:18px 22px" class="hint">' + esc(S.storeProblem) + '</div>');
  } else if (!S.groups.length) {
    setHTML(el, '<div style="padding:18px 22px" class="hint">No groups yet. Arrange some windows, then save a screen from <b>On screen now</b> below, or pick windows on the map.</div>');
  } else {
    setHTML(el, S.groups.map(g => {
      const n = g.slots.length, o = g.open;
      const cls = o === n ? "all" : o > 0 ? "some" : "";
      const sel = view.kind === "group" && view.id === g.id;
      return '<div class="row' + (sel ? " sel" : "") + '" data-id="' + esc(g.id) + '">' +
        '<div class="tick' + (ticked.has(g.id) ? " on" : "") + '" data-tick="' + esc(g.id) + '"></div>' +
        '<div style="min-width:0"><div class="name">' + esc(g.name) + '</div>' +
        '<div class="meta"><b>' + o + '</b>/' + n + ' open &middot; ' + esc([...new Set(g.slots.map(s => monName(s.mon)))].join(" + ")) + (g.auto ? ' &middot; auto' : '') + '</div></div>' +
        miniLayout(g, cls) + '</div>';
    }).join(""));
  }
  const n = ticked.size;
  const b = $("#deploySel");
  b.disabled = n === 0;
  b.innerHTML = n ? 'Deploy ' + plural(n, "group") + ' <span class="k">' + n + '</span>' : "Tick groups to deploy together";
  const all = S.groups.length > 0 && n === S.groups.length;
  const sa = $("#selAll");
  sa.hidden = !S.groups.length || !!S.storeProblem;
  sa.textContent = all ? "Clear" : "Select all";
  const d = $("#deleteSel");
  d.hidden = n === 0;
  d.textContent = all && n > 1 ? "Delete all" : "Delete";
}

function saveTicks() { localStorage.setItem("wg.ticked", JSON.stringify([...ticked])); }

// A thumbnail of a group: its windows on the screen it mostly sits on.
function miniLayout(g, cls) {
  const counts = new Map();
  for (const s of g.slots) counts.set(s.mon, (counts.get(s.mon) || 0) + 1);
  const mi = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
  const m = mi && S.monitors.find(x => x.i === mi[0]);
  if (!m) return '<div class="dot ' + cls + '"></div>';
  const W = 28, H = 18, sx = (W - 1) / m.w, sy = (H - 1) / m.h;
  const rects = g.slots.filter(s => s.mon === m.i).map(s => {
    const v = slotVis(s);
    const x = Math.max(0, v.x - m.x) * sx, y = Math.max(0, v.y - m.y) * sy;
    const w = Math.min(m.w, v.w) * sx, h = Math.min(m.h, v.h) * sy;
    return '<rect x="' + (x + .5).toFixed(1) + '" y="' + (y + .5).toFixed(1) + '" width="' + Math.max(1, w - 1).toFixed(1) + '" height="' + Math.max(1, h - 1).toFixed(1) + '"/>';
  }).join("");
  return '<svg class="mini ' + cls + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' + rects + '</svg>';
}

function renderDetected() {
  const el = $("#detected");
  const ds = detectedInScope();
  const mem = membership();
  $("#dCount").textContent = ds.length || "";
  if (!ds.length) {
    setHTML(el, '<div style="padding:0 22px 16px" class="hint">No screen has two or more ' + (scope === "all" ? "" : "Claude ") + 'windows on it right now.</div>');
    return;
  }
  const per = {}, nth = {};
  ds.forEach(d => { per[d.mon] = (per[d.mon] || 0) + 1; });
  setHTML(el, ds.map(d => {
    const sel = view.kind === "detected" && view.key === d.key;
    const isSnap = d.kind === "snap";
    const k = d.handles.filter(h => mem.has(h)).length, all = d.handles.length;
    const st = d.savedAs || k === all ? "g" : isSnap ? "s" : k > 0 ? "p" : "u";
    const said = d.savedAs ? 'Grouped &middot; <b>' + esc(d.savedAs) + '</b>' + (isSnap ? ' &middot; snapped' : '')
               : k === all ? 'Grouped'
               : isSnap ? 'Snap group &middot; ' + (S.settings.keepSnaps ? 'keeping it' : 'not kept')
               : k > 0 ? k + ' of ' + all + ' grouped' : 'Not grouped - just placed';
    if (isSnap) nth[d.mon] = (nth[d.mon] || 0) + 1;
    const tag = per[d.mon] > 1 ? '<i>' + (isSnap ? 'snap ' + nth[d.mon] : 'placed') + '</i>' : '';
    return '<div class="row' + (sel ? " sel" : "") + '" data-key="' + d.key + '">' +
      '<div class="state ' + st + '">' + (st === "u" ? ICON_LOOSE : ICON_GROUPED) + '</div>' +
      '<div style="min-width:0"><div class="name">' + esc(d.monName) + tag + '</div>' +
      '<div class="meta">' + plural(all, "window") + ' &middot; ' + (d.tiled ? "tiled" : "loose") +
      (d.hidden ? ' &middot; behind others' : '') + (d.behind ? ' &middot; +' + d.behind + ' behind' : '') + '</div>' +
      '<div class="meta" style="color:' + (st === "g" || st === "s" ? "var(--paper)" : st === "p" ? "var(--amber)" : "var(--mute-2)") + '">' + said + '</div></div>' +
      '<div class="dot' + (st === "g" ? " all" : st === "s" ? " snap" : st === "p" ? " some" : "") + '"></div></div>';
  }).join(""));
}

// The exact outline of a set of overlapping rectangles. A bounding box around a group would
// swallow a window that merely sits between two of its members and make it look grouped; the
// layer has to follow the group's windows and nothing else. Every rectangle edge cuts the plane
// into a small grid, each cell is in or out, and an outline edge is wherever an "in" cell meets
// an "out" one. A dozen windows make a few hundred cells - nothing.
function unionOutline(rects) {
  const xs = [...new Set(rects.flatMap(r => [r.l, r.r]))].sort((a, b) => a - b);
  const ys = [...new Set(rects.flatMap(r => [r.t, r.b]))].sort((a, b) => a - b);
  const cells = [];
  for (let i = 0; i < xs.length - 1; i++) {
    cells.push([]);
    for (let j = 0; j < ys.length - 1; j++) {
      const cx = (xs[i] + xs[i + 1]) / 2, cy = (ys[j] + ys[j + 1]) / 2;
      cells[i].push(rects.some(r => cx > r.l && cx < r.r && cy > r.t && cy < r.b));
    }
  }
  const inside = (i, j) => i >= 0 && j >= 0 && i < cells.length && j < cells[0].length && cells[i][j];
  const f = v => v.toFixed(1);
  let fill = "", edges = "";
  for (let i = 0; i < cells.length; i++) for (let j = 0; j < cells[i].length; j++) {
    if (!cells[i][j]) continue;
    const x1 = f(xs[i]), x2 = f(xs[i + 1]), y1 = f(ys[j]), y2 = f(ys[j + 1]);
    fill += "M" + x1 + " " + y1 + "H" + x2 + "V" + y2 + "H" + x1 + "Z";
    if (!inside(i - 1, j)) edges += "M" + x1 + " " + y1 + "V" + y2;
    if (!inside(i + 1, j)) edges += "M" + x2 + " " + y1 + "V" + y2;
    if (!inside(i, j - 1)) edges += "M" + x1 + " " + y1 + "H" + x2;
    if (!inside(i, j + 1)) edges += "M" + x1 + " " + y2 + "H" + x2;
  }
  return { fill, edges };
}

// ------------------------------------------------------------------ the map
// Every screen is its own card, to scale and where it sits, with a header strip above it: the
// screen's name, and one chip per group on it, front to back. The first map drew all screens
// edge to edge with names inside them - two groups on one screen put their labels on top of each
// other, and a screen's name sat on the screen below it. Headers live in the gaps instead.
const HEAD = 30, GAP_X = 18, GAP_Y = 10;

function geometry(mons) {
  const box = $("#stage").getBoundingClientRect();
  // Edges closer than this are the same row or column (screens are rarely aligned to the pixel).
  const near = 60;
  const cluster = vals => { const out = []; for (const v of [...vals].sort((a, b) => a - b)) if (!out.length || v - out[out.length - 1] > near) out.push(v); return out; };
  const minX = Math.min(...mons.map(m => m.x)), minY = Math.min(...mons.map(m => m.y));
  const maxX = Math.max(...mons.map(m => m.x + m.w)), maxY = Math.max(...mons.map(m => m.y + m.h));
  const xe = cluster(mons.map(m => m.x).filter(x => x > minX + near));
  const ye = cluster(mons.map(m => m.y).filter(y => y > minY + near));
  const gapsW = xe.length * GAP_X, gapsH = HEAD + ye.length * (HEAD + GAP_Y);
  const s = Math.max(0.01, Math.min((box.width - gapsW - 8) / (maxX - minX), (box.height - gapsH - 6) / (maxY - minY)));
  const ox = Math.max(4, (box.width - (maxX - minX) * s - gapsW) / 2);
  const oy = Math.max(2, (box.height - (maxY - minY) * s - gapsH) / 2);
  const before = (edges, v) => edges.filter(e => e <= v + near).length;
  const card = new Map();
  for (const m of mons) card.set(m.i, {
    m, left: ox + (m.x - minX) * s + before(xe, m.x) * GAP_X,
    top: oy + HEAD + (m.y - minY) * s + before(ye, m.y) * (HEAD + GAP_Y),
    w: m.w * s, h: m.h * s
  });
  return { s, card };
}

// A rectangle in screen pixels -> inside its screen's card, clipped to the screen.
function inCard(cd, s, x, y, w, h) {
  const m = cd.m;
  const l = Math.max(x, m.x), t = Math.max(y, m.y), r = Math.min(x + w, m.x + m.w), b = Math.min(y + h, m.y + m.h);
  if (r - l < 4 || b - t < 4) return null;
  return { l: (l - m.x) * s, t: (t - m.y) * s, r: (r - m.x) * s, b: (b - m.y) * s };
}

// Which groups a window belongs to, as attributes - pointing at a group lights these up.
function memAttrs(h, mem, snaps) {
  const gs = mem.get(h), sd = snaps.get(h);
  return (gs ? ' data-gm="' + esc(gs.map(x => x.id).join(" ")) + '"' : '') + (sd ? ' data-dm="' + esc(sd.key) + '"' : '');
}

function tileHtml(cls, r, title, sub, attrs, n, mark) {
  const W = Math.max(10, r.r - r.l), H = Math.max(10, r.b - r.t);
  // Names stay on narrow tiles - in smaller type. The first version hid them under 90px, and a
  // tall portrait screen shrinks the map so much that a column of thirds lost every name.
  const small = W < 46 || H < 28, narrow = !small && W < 118;
  return '<div class="tile ' + cls + (narrow ? " narrow" : "") + (small ? " small" : "") + '" ' + (attrs || "") + ' title="' + esc(title) + '" style="left:' + r.l.toFixed(1) + 'px;top:' + r.t.toFixed(1) +
    'px;width:' + W.toFixed(1) + 'px;height:' + H.toFixed(1) + 'px">' +
    (mark && W >= 26 && H >= 20 ? '<span class="gi ' + mark + '">' + (mark === "g" ? ICON_GROUPED : ICON_LOOSE) + '</span>' : '') +
    (n && !small && H >= 44 ? '<span class="n">' + n + '</span>' : '') +
    (small ? '' : '<div class="t">' + esc(title) + '</div>' + (sub ? '<div class="s">' + sub + '</div>' : '')) + '</div>';
}

// Windows mostly hidden behind others on their screen - so a layout stacked behind another is
// known to be behind, and its chip says so.
function hiddenSet(wins) {
  const res = new Set(), byMon = new Map();
  for (const w of wins) { if (!byMon.has(w.mon)) byMon.set(w.mon, []); byMon.get(w.mon).push(w); }
  for (const list of byMon.values()) {
    const above = [];
    for (const w of list.slice().sort((a, b) => a.z - b.z)) {
      let hit = 0, all = 0;
      for (let i = 0; i < 12; i++) for (let j = 0; j < 8; j++) {
        const px = w.vx + (i + .5) * w.vw / 12, py = w.vy + (j + .5) * w.vh / 8; all++;
        if (above.some(a => px >= a.vx && px < a.vx + a.vw && py >= a.vy && py < a.vy + a.vh)) hit++;
      }
      if (hit / all > 0.7) res.add(w.h); else above.push(w);
    }
  }
  return res;
}

// Grouped means in a saved group, or in a snap group Windows made.
function statusOf(w, mem, snaps) {
  const gs = mem.get(w.h);
  if (gs) return { k: "g", groups: gs };
  const sd = snaps.get(w.h);
  if (sd) return { k: "s", snap: sd };
  return { k: "u" };
}
// The visible part of a saved slot. On Windows a window's rectangle includes an invisible 7px
// resize border on the left, right and bottom; the server says how wide it is (0 on a Mac).
function slotVis(sl) {
  const b = S && S.inset != null ? S.inset : 7;
  return { x: sl.x + b, y: sl.y, w: sl.w - 2 * b, h: sl.h2 - b };
}
const isMac = () => !!S && S.platform === "mac";
const matches = w => !query || (w.title || "").toLowerCase().includes(query);
const passes = (w, st) => (filter === "all" || (filter === "grouped") === (st.k !== "u")) && matches(w);

// The screens the current selection is on.
function focusMons() {
  if (view.kind === "detected") { const d = curDetected(); return d ? new Set([d.mon]) : null; }
  if (view.kind === "group") {
    const gr = S.groups.find(x => x.id === view.id);
    if (!gr) return null;
    const s = new Set(gr.slots.map(x => x.mon).filter(x => x >= 0));
    for (const sl of gr.slots) if (sl.open) { const w = winByH(sl.h); if (w && !w.min) s.add(w.mon); }
    return s.size ? s : null;
  }
  return null;
}

// Every group on one screen, front to back: saved groups and the snap groups Windows made.
function monLayers(m, wins, mem, hidden) {
  const out = [];
  for (const gr of S.groups) {
    let n, z, behind;
    if (view.kind === "group" && view.id === gr.id) {
      n = gr.slots.filter(s => s.mon === m.i).length; z = -1; behind = false;
    } else {
      const ws = gr.slots.filter(s => s.open).map(s => winByH(s.h)).filter(w => w && !w.min && w.mon === m.i && (scope === "all" || w.claude));
      n = ws.length;
      if (n) { z = Math.min(...ws.map(w => w.z)); behind = ws.every(w => hidden.has(w.h)); }
    }
    if (n) out.push({ t: "g", id: gr.id, name: gr.name, n, z, behind, snap: gr.snap, total: gr.slots.length });
  }
  for (const d of (S.detectedAll || [])) {
    const hs = d.snap || [];
    if (d.mon !== m.i || hs.length < 2 || hs.every(h => mem.has(h))) continue;
    const ws = hs.map(winByH).filter(w => w && (scope === "all" || w.claude));
    if (ws.length < 2) continue;
    out.push({ t: "d", key: d.key, name: "Snap group", n: ws.length, z: Math.min(...ws.map(w => w.z)), behind: !!d.hidden, unsaved: true });
  }
  return out.sort((a, b) => a.z - b.z);
}

function renderLegend() {
  setHTML($("#lgG"), ICON_GROUPED + "Grouped");
  setHTML($("#lgU"), ICON_LOOSE + "Not grouped");
}

function renderStage() {
  renderLegend();
  const c = $("#canvas");
  if (!S.monitors.length) { setHTML(c, ""); return; }
  const focus = focusMons();
  const zoomed = !!focus && !zoomAll;
  const mons = zoomed ? S.monitors.filter(m => focus.has(m.i)) : S.monitors;
  const g = geometry(mons);
  const s = g.s;
  const wins = winsInScope().filter(w => !w.min);
  const mem = membership(), snaps = snapGroups();
  const hidden = hiddenSet(wins);
  const names = h => esc((mem.get(h) || []).map(x => x.name).join(" / "));

  // What is lit: the selected group, the group a selected screen layout was saved as, whatever
  // is hovered (a group row, a chip).
  const active = new Set(), activeDet = new Set();
  if (view.kind === "group") active.add(view.id);
  if (view.kind === "detected") {
    const d = curDetected();
    activeDet.add(view.key);
    const gr = d && d.savedAs && S.groups.find(x => x.name === d.savedAs);
    if (gr) active.add(gr.id);
  }
  const litWin = new Set();
  for (const gr of S.groups) if (active.has(gr.id)) for (const sl of gr.slots) if (sl.open) litWin.add(sl.h);
  for (const d of (S.detectedAll || [])) if (activeDet.has(d.key)) for (const h of (d.snap && d.snap.length ? d.snap : d.handles)) litWin.add(h);

  let html = "";
  for (const m of mons) {
    const cd = g.card.get(m.i);
    const dim = !!focus && !focus.has(m.i);
    const layers = monLayers(m, wins, mem, hidden);

    // ---- header: name, size, the groups on it front to back
    const chips = layers.map((L, k) => {
      const on = L.t === "g" ? active.has(L.id) : activeDet.has(L.key);
      const attr = L.t === "g" ? 'data-gsel="' + esc(L.id) + '" data-hg="' + esc(L.id) + '"' : 'data-dsel="' + esc(L.key) + '" data-hd="' + esc(L.key) + '"';
      const tip = L.name + " - " + plural(L.n, "window") + " here" + (L.behind ? ", behind other windows" : k === 0 && layers.length > 1 ? ", in front" : "") + (L.unsaved ? " - made in Windows, not saved" : "");
      return '<span class="chip' + (on ? " on" : "") + (L.unsaved ? " snap" : "") + (L.behind ? " back" : "") + '" ' + attr + ' title="' + esc(tip) + '">' +
        '<span class="cn">' + esc(L.name) + '</span><i>' + L.n + '</i></span>';
    }).join("");
    html += '<div class="mh' + (dim ? " dim" : "") + '" style="left:' + cd.left.toFixed(1) + 'px;top:' + (cd.top - HEAD).toFixed(1) + 'px;width:' + cd.w.toFixed(1) + 'px">' +
      '<span class="mn" title="' + esc(m.name + " - " + m.w + " x " + m.h) + '"><b>' + esc(m.name) + '</b>' + (!layers.length && cd.w > 250 ? ' ' + m.w + '&times;' + m.h : '') + '</span>' + chips + '</div>';

    // ---- the group layers: one frame behind each group's windows on this screen
    let paths = "";
    const pad = 5;
    const frame = rs => rs.map(r => ({ l: r.l - pad, t: r.t - pad, r: r.r + pad, b: r.b + pad }));
    for (const gr of S.groups) {
      const fromSlots = view.kind === "group" && view.id === gr.id;
      const rs = [];
      for (const sl of gr.slots) {
        let r = null;
        if (fromSlots) { if (sl.mon === m.i) { const v = slotVis(sl); r = inCard(cd, s, v.x, v.y, v.w, v.h); } }
        else if (sl.open) { const w = winByH(sl.h); if (w && !w.min && w.mon === m.i && (scope === "all" || w.claude)) r = inCard(cd, s, w.vx, w.vy, w.vw, w.vh); }
        if (r) rs.push(r);
      }
      if (!rs.length) continue;
      const on = active.has(gr.id), dimL = (view.kind === "group" && !on) || (!on && rs.length && !fromSlots && [...gr.slots].filter(sl => sl.open).every(sl => hidden.has(sl.h)));
      const u = unionOutline(frame(rs));
      paths += '<g data-lg="' + esc(gr.id) + '" class="' + (on ? "on" : "") + (dimL ? " dim" : "") + '"><path class="lf" d="' + u.fill + '"/><path class="le" d="' + u.edges + '"/></g>';
    }
    for (const d of (S.detectedAll || [])) {
      const hs = d.snap || [];
      if (d.mon !== m.i || hs.length < 2 || hs.every(h => mem.has(h))) continue;
      const rs = hs.map(winByH).filter(w => w && (scope === "all" || w.claude)).map(w => inCard(cd, s, w.vx, w.vy, w.vw, w.vh)).filter(Boolean);
      if (rs.length < 2) continue;
      const on = activeDet.has(d.key);
      const u = unionOutline(frame(rs));
      paths += '<g data-ld="' + esc(d.key) + '" class="snapl' + (on ? " on" : "") + (view.kind === "group" || (!on && d.hidden) ? " dim" : "") + '"><path class="lf" d="' + u.fill + '"/><path class="le" d="' + u.edges + '"/></g>';
    }

    // ---- the windows
    let tiles = "";
    const here = wins.filter(w => w.mon === m.i).sort((a, b) => b.z - a.z);     // bottom of the stack first
    if (view.kind === "live") {
      // Drawn in stack order, except: windows the filter or search picks out come in front of the
      // rest (an ungrouped window hidden behind a group must still show under "Not grouped"), and
      // a lit group on top of everything, so a group stacked behind another shows while you point at it.
      const sifting = filter !== "all" || !!query;
      const rank = w => litWin.has(w.h) ? 2 : (picked.has(w.h) || (sifting && passes(w, statusOf(w, mem, snaps)))) ? 1 : 0;
      const order = here.map((w, i) => [w, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]);
      for (const w of order) {
        const st = statusOf(w, mem, snaps), on = picked.has(w.h);
        const out = !on && !passes(w, st);
        const sub = on ? "picked" : st.k === "g" ? names(w.h) : st.k === "s" ? "snap group &middot; not saved" : (w.max ? "maximized &middot; not grouped" : "not grouped");
        const r = inCard(cd, s, w.vx, w.vy, w.vw, w.vh); if (!r) continue;
        tiles += tileHtml("pick" + (on ? " on" : "") + (litWin.has(w.h) ? " hl" : "") + (st.k === "u" ? " loose" : "") + (st.k === "s" ? " snapm" : "") +
                          (out ? " out" : "") + (query && matches(w) ? " match" : ""), r, w.title, sub, 'data-pick="' + w.h + '"' + memAttrs(w.h, mem, snaps), null, st.k === "u" ? "u" : "g");
      }
    } else if (view.kind === "detected") {
      // Ticked windows are drawn last, so a layout sitting BEHIND others is shown in front while you
      // look at it. Every window on that screen can be clicked in or out - hidden ones included.
      const d = curDetected();
      const sel = dpick || new Set(d ? d.handles : []);
      const own = new Set(d ? d.handles : []);
      const order = here.filter(w => !sel.has(w.h) && !own.has(w.h))
        .concat(here.filter(w => !sel.has(w.h) && own.has(w.h)))
        .concat(here.filter(w => sel.has(w.h)));
      for (const w of order) {
        const st = statusOf(w, mem, snaps);
        const r = inCard(cd, s, w.vx, w.vy, w.vw, w.vh); if (!r) continue;
        const mark = st.k === "u" ? "u" : "g";
        const ma = memAttrs(w.h, mem, snaps);
        if (sel.has(w.h)) tiles += tileHtml("on pick" + (st.k === "s" ? " snapm" : ""), r, w.title,
                                            (st.k === "g" ? names(w.h) : st.k === "s" ? "snap group" : "not grouped") + " &middot; click to drop", 'data-dpick="' + w.h + '"' + ma, null, mark);
        else if (d && w.mon === d.mon) tiles += tileHtml("off", r, w.title, "click to add", 'data-dpick="' + w.h + '"' + ma, null, mark);
        else tiles += tileHtml("ghost", r, w.title, "", ma, null, mark);
      }
    } else if (view.kind === "group") {
      const gr = S.groups.find(x => x.id === view.id);
      const used = new Set(gr ? gr.slots.filter(sl => sl.open).map(sl => sl.h) : []);
      for (const w of here) if (!used.has(w.h)) {
        const r = inCard(cd, s, w.vx, w.vy, w.vw, w.vh);
        if (r) tiles += tileHtml("ghost", r, w.title, "", memAttrs(w.h, mem, snaps), null, mem.has(w.h) ? "g" : "u");
      }
      if (gr) for (const sl of gr.slots.slice().sort((a, b) => b.z - a.z)) {
        if (sl.mon !== m.i) continue;
        const v = slotVis(sl);
        const r = inCard(cd, s, v.x, v.y, v.w, v.h); if (!r) continue;
        const n = String(sl.i + 1).padStart(2, "0");
        const how = sl.layout ? "snap group" : sl.zone ? "snaps" : "placed";
        if (sl.open) tiles += tileHtml("on", r, sl.title, "open &middot; " + how, 'data-slot="' + sl.i + '" data-gm="' + esc(gr.id) + '"', n, "g");
        else tiles += tileHtml("missing", r, sl.title, "not open &middot; replace", 'data-miss="' + sl.i + '" data-gm="' + esc(gr.id) + '"', n);
      }
    }
    html += '<div class="mon' + (dim ? " dim" : "") + '" style="left:' + cd.left.toFixed(1) + 'px;top:' + cd.top.toFixed(1) + 'px;width:' + cd.w.toFixed(1) + 'px;height:' + cd.h.toFixed(1) + 'px">' +
      (paths ? '<svg class="layers">' + paths + '</svg>' : '') + tiles + '</div>';
  }
  setHTML(c, html);
  applyHover();
}

// Pointing at a group (its chip, or its row on the left) lifts its windows above the others and
// lights its frame - by toggling classes. Re-drawing the map on hover replaced the chip under the
// mouse between press and release, and the click never arrived.
function applyHover() {
  const c = $("#canvas");
  c.querySelectorAll(".hv").forEach(e => e.classList.remove("hv"));
  const q = [];
  if (hoverGroup) { const v = CSS.escape(hoverGroup); q.push('[data-gm~="' + v + '"]', '[data-lg="' + v + '"]', '[data-hg="' + v + '"]'); }
  if (hoverDet) { const v = CSS.escape(hoverDet); q.push('[data-dm="' + v + '"]', '[data-ld="' + v + '"]', '[data-hd="' + v + '"]'); }
  if (q.length) c.querySelectorAll(q.join(",")).forEach(e => e.classList.add("hv"));
}

function renderDetail() {
  const el = $("#detail");
  if (view.kind === "live") {
    $("#viewLabel").textContent = "Everything on screen";
    const mem = membership(), snaps = snapGroups();
    const all = winsInScope();
    const st = new Map(all.map(w => [w.h, statusOf(w, mem, snaps)]));
    const nGrouped = all.filter(w => st.get(w.h).k !== "u").length;
    const n = picked.size;
    const rows = all.filter(w => picked.has(w.h) || passes(w, st.get(w.h)))
                    .sort((a, b) => (st.get(a.h).k === "u" ? 0 : 1) - (st.get(b.h).k === "u" ? 0 : 1) || (a.mon - b.mon) || (a.z - b.z));
    const addOpts = '<option value="">Add to group...</option>' + S.groups.map(gr => '<option value="' + esc(gr.id) + '">' + esc(gr.name) + '</option>').join("");
    const fl = (f, label) => '<button class="cnt' + (filter === f ? " on" : "") + '" data-filter="' + f + '">' + label + '</button>';
    setHTML(el,
      '<div class="dhead"><div><div class="dtitle">' + (n ? plural(n, "window") + " picked" : "Everything on screen") + '</div>' +
      '<div class="dmeta meta">' + fl("all", plural(all.length, "window")) + ' &middot; ' + fl("grouped", '<b>' + nGrouped + '</b> grouped') + ' &middot; ' +
        fl("loose", '<b>' + (all.length - nGrouped) + '</b> not grouped') + ' &middot; ' + plural(S.monitors.length, "screen") + '</div></div>' +
      '<div class="actions">' +
        (n ? '<input id="newName" class="btn" style="width:200px;cursor:text" placeholder="Name a new group" autocomplete="off">' : '') +
        '<button class="btn primary" id="savePicked"' + (n ? "" : " disabled") + '>Save as group</button>' +
        (n && S.groups.length ? '<select class="dark btnsel" id="addPicked">' + addOpts + '</select>' : '') +
        '<button class="btn" id="frontPicked"' + (n ? "" : " disabled") + ' title="Bring them on top of everything, ready to use">Bring to front</button>' +
        '<button class="btn" id="showPicked"' + (n ? "" : " disabled") + ' title="Bring them to the front and outline them on your screens for a moment">Show on screen</button>' +
        (n ? '<button class="btn ghost" id="clearPicked">Clear</button>' : '') +
      '</div></div>' +
      (rows.length
        ? '<div class="wl">' + rows.map(w => {
            const s = st.get(w.h), on = picked.has(w.h);
            const said = s.k === "g" ? '<span class="st g">' + esc(s.groups.map(x => x.name).join(" / ")) + '</span>'
                       : s.k === "s" ? '<span class="st s">snap group &middot; not saved</span>'
                       : '<span class="st u">not grouped</span>';
            return '<div class="wrow' + (on ? " on" : "") + '" data-wpick="' + w.h + '">' +
              '<span class="tick' + (on ? " on" : "") + '"></span>' +
              '<span class="name">' + esc(w.title) + (w.min ? ' <i>minimized</i>' : '') + '</span>' +
              '<span class="meta">' + esc(monName(w.mon)) + '</span>' + said +
              '<button class="x fr" data-front="' + w.h + '" title="Bring to front">' + ICON_FRONT + '</button></div>';
          }).join("") + '</div>'
        : '<p class="hint" style="margin-top:16px">' + (query ? 'No window matches <b>' + esc(query) + '</b>.' : filter === "loose" ? 'Every window is in a group.' : 'Nothing here.') + '</p>') +
      '<p class="hint" style="margin-top:14px">Tick windows here or click them on the map - across any screens - then save them as a group or add them to one. ' +
        '<b>On screen now</b> lists the layout on every screen' + (isMac() ? '' : ' by itself, several per screen if that is how they are') + '.</p>');
    return;
  }

  if (view.kind === "detected") {
    const d = curDetected();
    if (!d) { view = { kind: "live" }; return renderDetail(); }
    if (!dpick) dpick = new Set(d.handles);
    const sel = [...dpick].filter(h => winByH(h));
    const changed = sel.length !== d.handles.length || d.handles.some(h => !dpick.has(h));
    const suggested = d.savedAs && !changed ? d.savedAs : freeName(d.monName);
    $("#viewLabel").textContent = "On screen now - " + d.monName + (d.kind === "snap" ? " - snap group" : " - placed");
    setHTML(el,
      '<div class="dhead"><div><div class="dtitle"><input id="newName" value="' + esc(suggested) + '" autocomplete="off"></div>' +
      '<div class="dmeta meta"><b>' + sel.length + '</b> of ' + plural(d.handles.length, "window") + ' ticked &middot; ' + (d.tiled ? "tiled" : "loose") +
      (d.hidden ? ' &middot; behind other windows' : '') + (d.behind ? ' &middot; ' + d.behind + ' hidden behind' : '') +
      (d.savedAs ? ' &middot; already saved as <b>' + esc(d.savedAs) + '</b>' : '') + '</div></div>' +
      '<div class="actions"><button class="btn primary" id="saveDetected"' + (sel.length ? '' : ' disabled') + '>Save ' + plural(sel.length, "window") + ' as group</button>' +
      '<button class="btn" id="frontDetected"' + (sel.length ? '' : ' disabled') + ' title="Bring them on top of everything, ready to use">Bring to front</button>' +
      '<button class="btn" id="showDetected"' + (sel.length ? '' : ' disabled') + ' title="Bring them to the front and outline them on your screens for a moment">Show on screen</button>' +
      (changed ? '<button class="btn ghost" id="resetPick">Reset</button>' : '') + '</div></div>' +
      '<p class="hint" style="margin-top:14px">Click a window on the map to take it out of this group or put it in - windows hidden behind count too. ' +
      (d.kind === "snap" && !d.savedAs
        ? '<b>Windows made this a snap group.</b> Windows forgets snap groups every time it restarts; ' +
          (S.settings.keepSnaps ? 'Brinback keeps it for you once it has held still for twenty seconds, as <b>' + esc(freeName(d.monName)) + '</b>.' : 'save it here and it comes back after a restart.')
        : '') + '</p>' +
      '<div class="slots">' + sel.map((h, i) => {
        const w = winByH(h) || {};
        return '<div class="slot"><span class="ix">' + String(i + 1).padStart(2, "0") + '</span><span class="name">' + esc(w.title) + '</span>' +
          '<span class="meta">' + esc(monName(w.mon)) + '</span><span class="meta">' + w.w + ' &times; ' + w.h2 + '</span>' +
          '<span class="st ok">' + (w.snapped ? 'snapped' : 'placed') + '</span>' +
          '<button class="x" title="Take it out" data-undpick="' + h + '">&times;</button></div>';
      }).join("") + '</div>');
    return;
  }

  const gr = S.groups.find(x => x.id === view.id);
  if (!gr) { view = { kind: "live" }; return renderDetail(); }
  $("#viewLabel").textContent = "Group - " + gr.name;
  const missing = gr.slots.filter(s => !s.open).length;
  const used = new Set(gr.slots.filter(s => s.open).map(s => s.h));
  const candidates = winsInScope().filter(w => !used.has(w.h));
  const nLayout = gr.slots.filter(s => s.layout).length, nZone = gr.slots.filter(s => !s.layout && s.zone).length, nPlaced = gr.slots.length - nLayout - nZone;
  const how = [nLayout ? nLayout + ' as a Windows snap group' : '', nZone ? nZone + ' snapped' : '', nPlaced ? nPlaced + ' placed exactly' : ''].filter(Boolean).join(', ');
  const screens = [...new Set(gr.slots.map(s => monName(s.mon)))].join(" + ");
  setHTML(el,
    '<div class="dhead"><div><div class="dtitle"><input id="renameIn" value="' + esc(gr.name) + '" autocomplete="off"></div>' +
    '<div class="dmeta meta"><b>' + gr.open + '</b>/' + gr.slots.length + ' open' + (missing ? ' &middot; <span style="color:var(--amber)">' + missing + ' not open</span>' : '') +
    ' &middot; ' + esc(screens) + ' &middot; saved ' + esc(gr.saved || "") + '</div>' +
    '<div class="dmeta meta" style="margin-top:2px">Deploys ' + how + '</div></div>' +
    '<div class="actions">' +
      '<button class="btn primary" id="deployOne">Deploy</button>' +
      '<button class="btn" id="frontGroup" title="Bring its windows on top of everything else, without moving them"' + (gr.open ? '' : ' disabled') + '>Bring to front</button>' +
      '<button class="btn" id="minGroup" title="Minimize its windows"' + (gr.open ? '' : ' disabled') + '>Minimize</button>' +
      '<button class="btn" id="showGroup" title="Bring its windows to the front and outline them; windows that are not open show where they would go">Show on screen</button>' +
      '<button class="btn" id="updateGroup" title="Save where this group\'s windows are right now">Update positions</button>' +
      '<div class="switch' + (gr.auto ? " on" : "") + '" id="swGroupAuto" style="margin:0 6px" title="Put this group back by itself when its windows open"><span class="track"></span><span class="cap">Auto</span></div>' +
      '<button class="btn ghost danger" id="deleteGroup">Delete</button>' +
    '</div></div>' +
    '<div class="slots">' + gr.slots.map(s => {
      const opts = '<option value="">' + (s.open ? "Swap for..." : "Replace with...") + '</option>' +
        candidates.map(w => '<option value="' + w.h + '">' + esc(w.title) + '</option>').join("");
      return '<div class="slot">' +
        '<span class="ix">' + String(s.i + 1).padStart(2, "0") + '</span>' +
        '<span class="name" style="' + (s.open ? "" : "color:var(--mute)") + '">' + esc(s.title) + '</span>' +
        '<span class="meta">' + esc(monName(s.mon)) + '</span>' +
        '<span class="meta">' + s.w + ' &times; ' + s.h2 + (s.max ? " max" : "") + '</span>' +
        (s.open ? '<span class="st ok">open &middot; ' + (s.layout ? 'snap group' : s.zone ? 'snaps' : 'placed') + '</span>'
                : '<select class="dark" data-replace="' + s.i + '">' + opts + '</select>') +
        '<button class="x" title="Remove from group" data-remove="' + s.i + '">&times;</button>' +
      '</div>';
    }).join("") + '</div>' +
    '<p class="hint" style="margin-top:14px">' +
      (nLayout ? '<b>Snap group</b>: windows that together fill a screen are deployed through Snap Layouts and Snap Assist, the way you would do it by hand - so Windows makes them one group, listed as a Group in the taskbar and in Alt+Tab. ' : '') +
      (nZone ? '<b>Snaps</b>: snapped to its half or quarter on its own. ' : '') +
      (nPlaced ? '<b>Placed</b>: put at its exact position and size - for windows that do not fill a screen together. ' : '') + '</p>' +
    (missing ? '<p class="hint" style="margin-top:10px">A dashed slot is a window that is not open. Click it on the map, or use <b>Replace with</b>, to put another open window in that place.</p>' : ''));
}

// ------------------------------------------------------------------ interaction
$("#groups").addEventListener("click", e => {
  const t = e.target.closest("[data-tick]");
  if (t) {
    const id = t.getAttribute("data-tick");
    ticked.has(id) ? ticked.delete(id) : ticked.add(id);
    localStorage.setItem("wg.ticked", JSON.stringify([...ticked]));
    renderGroups(); return;
  }
  const r = e.target.closest("[data-id]");
  if (!r) return;
  const id = r.getAttribute("data-id");
  if (view.kind === "group" && view.id === id) { backToAll(); return; }     // click again: deselect
  view = { kind: "group", id }; dpick = null; closePop(); render();
});
$("#groups").addEventListener("dblclick", e => {
  const r = e.target.closest("[data-id]");
  if (r && !e.target.closest("[data-tick]")) run("deploy", { ids: [r.getAttribute("data-id")] });
});
$("#groups").addEventListener("mouseover", e => {
  const r = e.target.closest("[data-id]");
  const id = r ? r.getAttribute("data-id") : null;
  if (id !== hoverGroup) { hoverGroup = id; hoverDet = null; applyHover(); }
});
$("#groups").addEventListener("mouseleave", () => { if (hoverGroup) { hoverGroup = null; applyHover(); } });

$("#detected").addEventListener("click", e => {
  const r = e.target.closest("[data-key]");
  if (!r) return;
  const key = r.getAttribute("data-key");
  if (view.kind === "detected" && view.key === key) { backToAll(); return; }   // click again: deselect
  openDetected(key);
});
$("#deploySel").addEventListener("click", () => run("deploy", { ids: [...ticked] }));
$("#selAll").addEventListener("click", () => {
  const all = S.groups.length > 0 && ticked.size === S.groups.length;
  ticked.clear();
  if (!all) for (const g of S.groups) ticked.add(g.id);
  saveTicks(); renderGroups();
});
$("#deleteSel").addEventListener("click", async () => {
  const ids = [...ticked], n = ids.length;
  if (!n) return;
  const all = n === S.groups.length;
  const one = n === 1 ? S.groups.find(g => g.id === ids[0]) : null;
  const title = one ? "Delete " + one.name + "?" : all ? "Delete all " + n + " groups?" : "Delete " + n + " groups?";
  if (!await confirmBox(title, "The groups go. The windows themselves are not touched.", all && n > 1 ? "Delete all" : "Delete", true)) return;
  await run("delete", { ids });
  ticked.clear(); saveTicks();
  if (view.kind === "group" && ids.includes(view.id)) view = { kind: "live" };
  render();
});

$("#filter").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f; localStorage.setItem("wg.filter", filter); render();
});
$("#zoom").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  zoomAll = b.dataset.z === "all"; localStorage.setItem("wg.zoomAll", zoomAll ? "1" : "0"); render();
});
$("#search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
$("#search").addEventListener("keydown", e => { if (e.key === "Escape") { e.target.value = ""; query = ""; e.target.blur(); render(); e.stopPropagation(); } });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) { e.preventDefault(); $("#search").focus(); }
});
// Pointing at a chip lifts that group above the others on the map - the way to see a group
// stacked behind another one on the same screen.
$("#canvas").addEventListener("mouseover", e => {
  const c = e.target.closest("[data-hg],[data-hd]");
  const g = c ? c.getAttribute("data-hg") : null, d = c ? c.getAttribute("data-hd") : null;
  if (g !== hoverGroup || d !== hoverDet) { hoverGroup = g; hoverDet = d; applyHover(); }
});
$("#canvas").addEventListener("mouseleave", () => { if (hoverGroup || hoverDet) { hoverGroup = null; hoverDet = null; applyHover(); } });

$("#scope").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  scope = b.dataset.s; scopeTouched = true; localStorage.setItem("wg.scope", scope);
  if (view.kind === "detected") { view = { kind: "live" }; dpick = null; }
  render();
});

$("#backAll").addEventListener("click", backToAll);
$("#swAuto").addEventListener("click", () => run("setting", { key: "autoRestore", value: !S.settings.autoRestore }));
$("#swStart").addEventListener("click", () => run("setting", { key: "startWithWindows", value: !S.settings.startWithWindows }));
$("#grantAccess").addEventListener("click", () => run("openAccessibility"));
$("#update").addEventListener("click", () => { shownUpdateError = null; run("selfUpdate").catch(() => {}); });
$("#swSnap").addEventListener("click", () => run("setting", { key: "keepSnaps", value: !S.settings.keepSnaps }));

$("#canvas").addEventListener("click", e => {
  const gl = e.target.closest("[data-gsel]");
  if (gl) {
    const id = gl.getAttribute("data-gsel");
    if (view.kind === "group" && view.id === id) { backToAll(); return; }      // click again: deselect
    view = { kind: "group", id }; dpick = null; closePop(); render(); return;
  }
  const dl = e.target.closest("[data-dsel]");
  if (dl) { const k = dl.getAttribute("data-dsel"); if (view.kind === "detected" && view.key === k) backToAll(); else openDetected(k); return; }
  const dp = e.target.closest("[data-dpick]");
  if (dp && dpick) { const h = dp.getAttribute("data-dpick"); dpick.has(h) ? dpick.delete(h) : dpick.add(h); render(); return; }
  const p = e.target.closest("[data-pick]");
  if (p) { const h = p.getAttribute("data-pick"); picked.has(h) ? picked.delete(h) : picked.add(h); render(); return; }
  const m = e.target.closest("[data-miss]");
  if (m) { openReplace(+m.getAttribute("data-miss"), m.getBoundingClientRect()); return; }
});

// Double-click a window on the map: bring it to the front.
$("#canvas").addEventListener("dblclick", e => {
  const p = e.target.closest("[data-pick],[data-dpick],[data-slot]");
  if (!p) return;
  let h = p.getAttribute("data-pick") || p.getAttribute("data-dpick");
  if (!h && view.kind === "group") { const gr = S.groups.find(x => x.id === view.id); const sl = gr && gr.slots[+p.getAttribute("data-slot")]; h = sl && sl.h; }
  if (h) { picked.delete(h); run("frontWindow", { handle: h }); }
});

function openReplace(index, rect) {
  closePop();
  const gr = S.groups.find(x => x.id === view.id); if (!gr) return;
  const slot = gr.slots[index];
  const used = new Set(gr.slots.filter(s => s.open).map(s => s.h));
  const cands = winsInScope().filter(w => !used.has(w.h));
  pop = document.createElement("div");
  pop.className = "pop";
  pop.innerHTML = '<div class="ph"><div class="cap">Not open</div><div style="margin-top:8px;font-weight:500">' + esc(slot.title) +
    '</div><div class="meta" style="margin-top:6px">Put another open window in its place:</div></div>' +
    (cands.length ? cands.map(w => '<div class="pi" data-h="' + w.h + '"><span>' + esc(w.title) + '</span><span class="meta">' + esc(monName(w.mon)) + '</span></div>').join("")
                  : '<div class="pi" style="cursor:default;color:var(--mute)">No other windows open.</div>');
  const x = Math.min(window.innerWidth - 330, Math.max(10, rect.left));
  const y = Math.min(window.innerHeight - 370, Math.max(68, rect.top));
  pop.style.left = x + "px"; pop.style.top = y + "px";
  pop.addEventListener("click", e => {
    const it = e.target.closest("[data-h]"); if (!it) return;
    closePop();
    run("replace", { id: gr.id, index, handle: it.getAttribute("data-h") });
  });
  document.body.appendChild(pop);
}

$("#detail").addEventListener("click", async e => {
  const id = e.target.id || (e.target.closest("button") || {}).id;
  const gr = view.kind === "group" ? S.groups.find(x => x.id === view.id) : null;

  if (id === "clearPicked") { picked.clear(); render(); }
  const fl = e.target.closest("[data-filter]");
  if (fl) { filter = fl.getAttribute("data-filter"); localStorage.setItem("wg.filter", filter); render(); return; }
  const fr = e.target.closest("[data-front]");
  if (fr) { run("frontWindow", { handle: fr.getAttribute("data-front") }); return; }
  const wp = e.target.closest("[data-wpick]");
  if (wp) { const h = wp.getAttribute("data-wpick"); picked.has(h) ? picked.delete(h) : picked.add(h); render(); return; }
  if (id === "showPicked") run("overlayHandles", { handles: [...picked], label: "Picked" });
  if (id === "frontPicked") run("frontHandles", { handles: [...picked] });
  if (id === "frontDetected" && dpick) run("frontHandles", { handles: [...dpick] });
  if (id === "savePicked" || id === "saveDetected") {
    const name = ($("#newName") && $("#newName").value.trim()) || "";
    if (!name) { toast("Give the group a name first.", true); if ($("#newName")) $("#newName").focus(); return; }
    const handles = id === "savePicked" ? [...picked] : [...(dpick || [])];
    const saved = j => { toast(j.message); picked.clear(); dpick = null; view = { kind: "group", id: j.id }; };
    try {
      saved(await act("save", { name, handles })); await load();
    } catch (err) {
      if (err.status !== 409) { toast(err.message, true); return; }
      const other = freeName(name);
      const pick = await choiceBox(name + " already exists",
        "Save these as a new group next to it, or replace what " + name + " holds with these windows?",
        [{ label: "Replace " + name, value: "replace", cls: "danger" }, { label: "Save as " + other, value: "new", cls: "primary" }]);
      if (pick === "new") saved(await run("save", { name: other, handles }));
      if (pick === "replace") saved(await run("save", { name, handles, replace: true }));
      render();
    }
  }
  if (id === "resetPick") { const d = curDetected(); dpick = d ? new Set(d.handles) : null; render(); }
  const und = e.target.closest("[data-undpick]");
  if (und && dpick) { dpick.delete(und.getAttribute("data-undpick")); render(); }
  if (id === "showDetected") {
    const d = curDetected();
    if (d && dpick) run("overlayHandles", { handles: [...dpick], label: d.monName });
  }
  if (!gr) return;
  if (id === "deployOne") run("deploy", { ids: [gr.id] });
  if (id === "frontGroup") run("front", { id: gr.id });
  if (id === "minGroup") run("minimize", { id: gr.id });
  if (id === "showGroup") run("overlay", { id: gr.id });
  if (id === "updateGroup") run("update", { id: gr.id });
  if (e.target.closest("#swGroupAuto")) run("auto", { id: gr.id, on: !gr.auto });
  if (id === "deleteGroup" && await confirmBox("Delete " + gr.name + "?", "The group goes. The windows themselves are not touched.", "Delete", true)) {
    await run("delete", { id: gr.id }); ticked.delete(gr.id); view = { kind: "live" }; render();
  }
  const rm = e.target.closest("[data-remove]");
  if (rm) {
    const i = +rm.getAttribute("data-remove");
    if (await confirmBox("Remove from " + gr.name + "?", gr.slots[i].title, "Remove", true)) run("removeSlot", { id: gr.id, index: i });
  }
});

$("#detail").addEventListener("change", e => {
  if (e.target.id === "addPicked" && e.target.value) {
    run("addToGroup", { id: e.target.value, handles: [...picked] }).then(() => { picked.clear(); render(); }, () => {});
    return;
  }
  const s = e.target.closest("[data-replace]");
  if (s && s.value && view.kind === "group") run("replace", { id: view.id, index: +s.getAttribute("data-replace"), handle: s.value });
});

$("#detail").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "newName") {
    const b = $("#savePicked") || $("#saveDetected"); if (b) b.click();
  }
  if (e.key === "Enter" && e.target.id === "renameIn") e.target.blur();
  if (e.key === "Escape" && e.target.id === "renameIn") { e.target.value = (S.groups.find(x => x.id === view.id) || {}).name || ""; e.target.blur(); }
});
$("#detail").addEventListener("focusout", e => {
  if (e.target.id !== "renameIn" || view.kind !== "group") return;
  const gr = S.groups.find(x => x.id === view.id);
  const v = e.target.value.trim();
  if (gr && v && v !== gr.name) run("rename", { id: gr.id, name: v });
});

window.addEventListener("resize", () => { if (S) renderStage(); });
// #g=<group id> or #screen=<n> opens straight on that group or screen
(function () {
  const m = location.hash.match(/^#(g|screen)=(.+)$/);
  if (m) view = m[1] === "g" ? { kind: "group", id: decodeURIComponent(m[2]) } : { kind: "detected", key: decodeURIComponent(m[2]).includes("-") ? decodeURIComponent(m[2]) : m[2] + "-0" };
})();
load();
</script>
</body>
</html>
